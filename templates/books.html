<html>
    <head>
        <title>Books</title>
        <link rel="stylesheet" href="/static/styles.css">
    </head>
    <body>
        <h1>Here are some books</h1>
        <ul class="books">
            {% for book in books %}
                <li>{{ book.title }} by {{ book.author }}</li>
            {% endfor %}
        </ul>
    </body>
</html>
